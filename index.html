<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working English 1 期中考紫色考點暨課文克漏字全覆蓋刷題系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        purpleAccent: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js for interactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .purple-highlight {
            background-color: #f3e8ff;
            color: #6b21a8;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 0.375rem;
            border: 1px solid #d8b4fe;
            display: inline-block;
            margin: 0 0.1rem;
        }
        .blank-num {
            color: #2563eb;
            font-weight: 800;
        }
        /* Custom scrollbar for nav drawer */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full text-slate-800 bg-slate-100 flex flex-col font-sans" x-data="quizApp()" x-init="initApp()">

    <!-- Top Navigation Header -->
    <header class="bg-indigo-900 text-white shadow-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white font-extrabold text-xl shadow-inner">WE1</div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black tracking-tight text-white flex items-center gap-2">
                        Working English 1 期中考克漏字與紫色考點全覆蓋特訓系統
                        <span class="hidden sm:inline-block bg-purple-500/30 text-purple-200 border border-purple-400/40 text-xs px-2.5 py-0.5 rounded-full font-medium">100% 講義暨課本無刪減版</span>
                    </h1>
                    <p class="text-xs text-indigo-200">依據小考考卷與上課簡報重點精心打造 ‧ 滿分應試神兵</p>
                </div>
            </div>

            <!-- Mode Selector & Controls -->
            <div class="flex items-center gap-3 flex-wrap">
                <!-- Mode Toggle Button -->
                <div class="bg-indigo-950 p-1 rounded-xl flex items-center border border-indigo-700/50">
                    <button @click="setMode('practice')" 
                            :class="mode === 'practice' ? 'bg-indigo-600 text-white shadow font-bold' : 'text-indigo-300 hover:text-white'"
                            class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        即時解析模式
                    </button>
                    <button @click="setMode('exam')" 
                            :class="mode === 'exam' ? 'bg-amber-600 text-white shadow font-bold' : 'text-indigo-300 hover:text-white'"
                            class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        模擬考試模式
                    </button>
                </div>

                <!-- Progress Badge -->
                <div class="bg-indigo-800/80 px-3 py-1.5 rounded-xl border border-indigo-700 text-xs flex items-center gap-2">
                    <span class="text-indigo-200">完成度:</span>
                    <span class="font-bold text-amber-300" x-text="`${answeredCount}/${filteredQuestions.length}`"></span>
                </div>

                <!-- Nav Modal Trigger -->
                <button @click="showNavModal = true" class="bg-purple-600 hover:bg-purple-500 px-3.5 py-1.5 rounded-xl text-xs font-bold text-white transition flex items-center gap-1.5 shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    考點地圖 (<span x-text="filteredQuestions.length"></span>題)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- Filters Bar -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between">
            <!-- Unit Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 lg:pb-0 scrollbar-none">
                <button @click="setUnit('all')" 
                        :class="selectedUnit === 'all' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-4 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition">
                    全部單元 (Full Exam)
                </button>
                <button @click="setUnit('unit1')" 
                        :class="selectedUnit === 'unit1' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-4 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition">
                    Unit 1: Online Job Search
                </button>
                <button @click="setUnit('unit2')" 
                        :class="selectedUnit === 'unit2' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-4 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition">
                    Unit 2: Introductions & Interviews
                </button>
                <button @click="setUnit('unit3')" 
                        :class="selectedUnit === 'unit3' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-4 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition">
                    Unit 3: Breaking the Ice
                </button>
            </div>

            <!-- Section Type Filter -->
            <div class="flex items-center gap-1.5 overflow-x-auto bg-slate-100 p-1.5 rounded-xl">
                <button @click="selectedSection = 'all'" 
                        :class="selectedSection === 'all' ? 'bg-white text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                        class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">全部大題</button>
                <button @click="selectedSection = 'Listening'" 
                        :class="selectedSection === 'Listening' ? 'bg-white text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                        class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">Listening 聽力</button>
                <button @click="selectedSection = 'Conversation'" 
                        :class="selectedSection === 'Conversation' ? 'bg-white text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                        class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">Conversation 對話</button>
                <button @click="selectedSection = 'Reading'" 
                        :class="selectedSection === 'Reading' ? 'bg-white text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                        class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">Reading 閱讀</button>
                <button @click="selectedSection = 'Grammar'" 
                        :class="selectedSection === 'Grammar' ? 'bg-white text-indigo-700 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'"
                        class="px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">Grammar 文法特訓</button>
            </div>
        </div>

        <!-- Exam Result Banner (Visible in Exam Mode after Submit) -->
        <div x-show="mode === 'exam' && examSubmitted" x-cloak class="bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900 text-white rounded-2xl p-6 shadow-xl border border-indigo-500/30">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                    <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">測驗成績單</span>
                    <h2 class="text-3xl font-extrabold mt-2" x-text="`總得分：${examScore} / 100 分`"></h2>
                    <p class="text-slate-300 text-sm mt-1" x-text="`答對 ${correctCount} 題，答錯 ${incorrectCount} 題 (當前範圍共 ${filteredQuestions.length} 題)`"></p>
                </div>
                <div class="flex gap-3 flex-wrap">
                    <button @click="onlyIncorrect = !onlyIncorrect" 
                            :class="onlyIncorrect ? 'bg-amber-500 text-slate-950' : 'bg-rose-600 text-white hover:bg-rose-500'"
                            class="font-semibold px-4 py-2.5 rounded-xl text-sm transition shadow-md flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span x-text="onlyIncorrect ? '顯示全部題目' : `僅看錯題 (${incorrectCount})`"></span>
                    </button>
                    <button @click="resetExam()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition shadow-md">
                        重新測驗
                    </button>
                </div>
            </div>
        </div>

        <!-- Passages & Questions Container -->
        <div class="flex flex-col gap-8">
            <template x-for="(passage, pIdx) in groupedPassages" :key="pIdx">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    
                    <!-- Passage Header -->
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center justify-between flex-wrap gap-2">
                        <div class="flex items-center gap-3">
                            <span class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-100 text-indigo-800" x-text="passage.unit"></span>
                            <span class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-200 text-slate-700" x-text="passage.section"></span>
                            <h3 class="font-bold text-slate-800 text-base" x-text="passage.title"></h3>
                        </div>
                        <span class="text-xs font-semibold text-purpleAccent-700 bg-purpleAccent-50 border border-purpleAccent-200 px-2.5 py-1 rounded-lg" x-text="`本段共包含 ${passage.questions.length} 個紫色考點`"></span>
                    </div>

                    <!-- Context Box (Full Unabridged Passage) -->
                    <div class="p-6 bg-slate-50/70 border-b border-slate-200 text-slate-800 leading-relaxed font-sans text-base">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-2">
                            <span>【完整課文/講義對照段落 (無刪減)】</span>
                            <span class="text-purpleAccent-700">紫色高亮處即為小考/期中考必考考點</span>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-indigo-100 shadow-sm whitespace-pre-line text-slate-700 leading-loose" x-html="passage.passageHtml"></div>
                    </div>

                    <!-- Questions Grid -->
                    <div class="p-6 grid grid-cols-1 gap-6">
                        <template x-for="q in passage.questions" :key="q.id">
                            <div :id="`q-card-${q.id}`" 
                                 class="p-5 rounded-xl border transition-all duration-200"
                                 :class="{
                                     'border-slate-200 bg-white hover:border-indigo-300': !userAnswers[q.id],
                                     'border-rose-300 bg-rose-50/40': userAnswers[q.id] && (mode==='practice' || examSubmitted) && userAnswers[q.id] !== q.answer,
                                     'border-emerald-300 bg-emerald-50/40': userAnswers[q.id] && (mode==='practice' || examSubmitted) && userAnswers[q.id] === q.answer,
                                     'border-indigo-400 bg-indigo-50/20': userAnswers[q.id] && mode==='exam' && !examSubmitted
                                 }">
                                
                                <div class="flex items-start justify-between gap-4 mb-3">
                                    <div class="flex items-center gap-2">
                                        <span class="w-8 h-8 rounded-full bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shadow-sm" x-text="q.number"></span>
                                        <span class="font-bold text-slate-900 text-base" x-html="q.prompt"></span>
                                    </div>
                                    <span class="text-xs font-bold px-2.5 py-1 rounded bg-purpleAccent-100 text-purpleAccent-800 border border-purpleAccent-200 whitespace-nowrap" x-text="q.grammarTag"></span>
                                </div>

                                <!-- Options -->
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 my-3">
                                    <template x-for="opt in q.options" :key="opt.key">
                                        <button @click="selectAnswer(q.id, opt.key)"
                                                :disabled="mode === 'practice' && userAnswers[q.id]"
                                                class="px-4 py-3 rounded-xl border text-left text-sm font-medium transition flex items-center justify-between"
                                                :class="getOptionClass(q, opt.key)">
                                            <span x-text="`${opt.key}. ${opt.text}`"></span>
                                            
                                            <!-- Check/Cross Icon -->
                                            <template x-if="(mode === 'practice' || examSubmitted) && userAnswers[q.id]">
                                                <span>
                                                    <svg x-show="opt.key === q.answer" class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                                    <svg x-show="userAnswers[q.id] === opt.key && opt.key !== q.answer" class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                </span>
                                            </template>
                                        </button>
                                    </template>
                                </div>

                                <!-- Practice Mode Detailed Explanation Dropdown -->
                                <div x-show="(mode === 'practice' && userAnswers[q.id]) || examSubmitted" 
                                     x-transition 
                                     class="mt-4 pt-4 border-t border-slate-200 text-xs leading-relaxed space-y-2">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold px-2.5 py-0.5 rounded text-white text-[10px] uppercase"
                                              :class="userAnswers[q.id] === q.answer ? 'bg-emerald-600' : 'bg-rose-600'"
                                              x-text="userAnswers[q.id] === q.answer ? '正確 Correct' : '錯誤 Incorrect'"></span>
                                        <span class="font-extrabold text-slate-800 text-sm" x-text="`正確答案: (${q.answer})`"></span>
                                        <span class="text-slate-500 font-semibold" x-text="`‧ 考驗考點：${q.focus}`"></span>
                                    </div>
                                    <div class="bg-purpleAccent-50 p-3.5 rounded-xl border border-purpleAccent-100 text-slate-800">
                                        <div class="font-bold text-purpleAccent-800 mb-1 flex items-center gap-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            【詳細文法/介係詞解析】
                                        </div>
                                        <div x-html="q.explanation"></div>
                                    </div>
                                    <div class="text-slate-600 italic bg-slate-100 p-2.5 rounded-lg border border-slate-200" x-text="`句子翻譯：${q.translation}`"></div>
                                </div>

                            </div>
                        </template>
                    </div>

                </div>
            </template>
        </div>

        <!-- Floating Submit Bar for Exam Mode -->
        <div x-show="mode === 'exam' && !examSubmitted" class="fixed bottom-6 right-6 z-30">
            <button @click="submitExam()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3.5 rounded-2xl shadow-2xl transition border-2 border-amber-300 flex items-center gap-2 text-base">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                交卷結算成績 (<span x-text="`${answeredCount}/${filteredQuestions.length}`"></span>)
            </button>
        </div>

    </div>

    <!-- Navigation Modal -->
    <div x-show="showNavModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div @click.away="showNavModal = false" class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
                <div>
                    <h3 class="font-bold text-slate-900 text-lg">考點題目快速跳轉地圖</h3>
                    <p class="text-xs text-slate-500">當前範圍共有 <span class="font-bold text-indigo-600" x-text="filteredQuestions.length"></span> 個紫色重點挖空</p>
                </div>
                <button @click="showNavModal = false" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="py-6 grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 gap-2 max-h-96 overflow-y-auto">
                <template x-for="q in filteredQuestions" :key="q.id">
                    <button @click="scrollToQuestion(q.id)" 
                            class="h-10 rounded-xl font-bold text-xs flex items-center justify-center border transition shadow-sm"
                            :class="getNavButtonClass(q.id)">
                        <span x-text="q.number"></span>
                    </button>
                </template>
            </div>

            <div class="pt-4 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> 答對</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500"></span> 答錯</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-indigo-600"></span> 已答</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-200 border border-slate-300"></span> 未答</span>
                </div>
                <button @click="showNavModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-slate-700">關閉對話框</button>
            </div>
        </div>
    </div>

    <!-- Application Script Data -->
    <script>
        function quizApp() {
            return {
                mode: 'practice',
                selectedUnit: 'all',
                selectedSection: 'all',
                userAnswers: {},
                examSubmitted: false,
                examScore: 0,
                correctCount: 0,
                incorrectCount: 0,
                showNavModal: false,
                onlyIncorrect: false,

                // 100% Full Unabridged Dataset Covering ALL Purple Highlights from Slides & Textbook
                passagesData: [
                    // ==========================================
                    // UNIT 1: ONLINE JOB SEARCH
                    // ==========================================
                    {
                        id: 'u1-conversation',
                        unit: 'Unit 1',
                        unitKey: 'unit1',
                        section: 'Conversation',
                        title: 'Job Interview Call (Sam & Peter - Conversation p.11)',
                        passageHtml: `Sam: Carlton Finance Human Resources. This is Sam speaking. How can I help you today?
Peter: Hi, Sam. This is Peter. I'm calling <span class="purple-highlight">(1) <span class="blank-num">about</span></span> a job opening that I saw <span class="purple-highlight">(2) <span class="blank-num">on</span></span> your company's website.
Sam: Are you referring <span class="purple-highlight">(3) <span class="blank-num">to</span></span> the ad for stockbroker trainees?
Peter: Yes, that's correct.
Sam: Great. Do you have any experience working <span class="purple-highlight">(4) <span class="blank-num">in</span></span> the financial sector?
Peter: No, but I study economics <span class="purple-highlight">(5) <span class="blank-num">at</span></span> university.
Sam: That's fine. Past experience is a plus, but it's not necessary.
Peter: I'm glad to hear that.
Sam: It's a tough job, but if you work hard, you can earn a lot <span class="purple-highlight">(6) <span class="blank-num">of</span></span> money <span class="purple-highlight">(7) <span class="blank-num">in</span></span> the future.
Peter: How can I go <span class="purple-highlight">(8) <span class="blank-num">about applying</span></span> for the position?
Sam: The best thing to do is <span class="purple-highlight">(9) <span class="blank-num">to submit</span></span> a copy of your resume on our website. If we think you are <span class="purple-highlight">(10) <span class="blank-num">qualified</span></span>, we will call you <span class="purple-highlight">(11) <span class="blank-num">to set up</span></span> an interview.
Peter: OK, I'll do that later this afternoon.
Sam: Thanks a lot. I almost forgot. Be sure <span class="purple-highlight">(12) <span class="blank-num">to list</span></span> two personal references so we can get a better idea <span class="purple-highlight">(13) <span class="blank-num">of</span></span> your character.`,
                        questions: [

                get filteredQuestions() {
                    let questions = [];
                    this.groupedPassages.forEach(p => {
                        questions.push(...p.questions);
                    });
                    return questions;
                },

                get groupedPassages() {
                    return this.passagesData.filter(p => {
                        const matchUnit = this.selectedUnit === 'all' || p.unitKey === this.selectedUnit;
                        const matchSection = this.selectedSection === 'all' || p.section === this.selectedSection;
                        return matchUnit && matchSection;
                    }).map(p => {
                        if (this.onlyIncorrect) {
                            return {
                                ...p,
                                questions: p.questions.filter(q => this.userAnswers[q.id] && this.userAnswers[q.id] !== q.answer)
                            };
                        }
                        return p;
                    }).filter(p => p.questions.length > 0);
                },

                get answeredCount() {
                    const currentQIds = this.filteredQuestions.map(q => q.id);
                    return Object.keys(this.userAnswers).filter(id => currentQIds.includes(Number(id))).length;
                },

                initApp() {
                    // Application initialized
                },

                setUnit(unit) {
                    this.selectedUnit = unit;
                    this.onlyIncorrect = false;
                },

                setMode(newMode) {
                    this.mode = newMode;
                    if (newMode === 'exam') {
                        this.examSubmitted = false;
                        this.onlyIncorrect = false;
                    }
                },

                selectAnswer(questionId, optionKey) {
                    this.userAnswers[questionId] = optionKey;
                },

                getOptionClass(q, optKey) {
                    const userAns = this.userAnswers[q.id];
                    const isSelected = userAns === optKey;
                    
                    if (this.mode === 'practice' || this.examSubmitted) {
                        if (!userAns) {
                            return 'border-slate-200 bg-white text-slate-700 hover:border-indigo-400';
                        }
                        if (optKey === q.answer) {
                            return 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-1 ring-emerald-500';
                        }
                        if (isSelected && optKey !== q.answer) {
                            return 'border-rose-500 bg-rose-50 text-rose-900 font-bold ring-1 ring-rose-500';
                        }
                        return 'border-slate-200 bg-slate-50 text-slate-400 opacity-60';
                    } else {
                        if (isSelected) {
                            return 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold ring-2 ring-indigo-500';
                        }
                        return 'border-slate-200 bg-white text-slate-700 hover:border-indigo-300';
                    }
                },

                submitExam() {
                    const total = this.filteredQuestions.length;
                    if (total === 0) return;

                    let correct = 0;
                    this.filteredQuestions.forEach(q => {
                        if (this.userAnswers[q.id] === q.answer) {
                            correct++;
                        }
                    });

                    this.correctCount = correct;
                    this.incorrectCount = total - correct;
                    this.examScore = Math.round((correct / total) * 100);
                    this.examSubmitted = true;

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                resetExam() {
                    this.userAnswers = {};
                    this.examSubmitted = false;
                    this.onlyIncorrect = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                scrollToQuestion(id) {
                    this.showNavModal = false;
                    const el = document.getElementById(`q-card-${id}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                },

                getNavButtonClass(id) {
                    const ans = this.userAnswers[id];
                    const q = this.filteredQuestions.find(item => item.id === id);

                    if ((this.mode === 'practice' || this.examSubmitted) && ans) {
                        if (q && ans === q.answer) {
                            return 'bg-emerald-500 text-white border-emerald-600';
                        }
                        return 'bg-rose-500 text-white border-rose-600';
                    }

                    if (ans) {
                        return 'bg-indigo-600 text-white border-indigo-700';
                    }
                    return 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
                }
            }
        }
    </script>
</body>
</html>
