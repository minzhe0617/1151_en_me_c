<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working English 1 期中考克漏字與文法全考點刷題系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        purpleAccent: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .purple-text-highlight {
            background-color: #f3e8ff;
            color: #6b21a8;
            font-weight: 800;
            padding: 0.15rem 0.45rem;
            border-radius: 0.375rem;
            border: 1px solid #d8b4fe;
            display: inline-block;
            margin: 0 0.15rem;
            box-shadow: 0 1px 2px rgba(107, 33, 168, 0.1);
        }
        .blank-underline {
            background-color: #f1f5f9;
            color: #1e293b;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 0.375rem;
            border-bottom: 2px solid #3b82f6;
            display: inline-block;
            margin: 0 0.15rem;
        }
    </style>
</head>
<body class="h-full text-slate-800 bg-slate-100 flex flex-col font-sans" x-data="quizApp()" x-init="initApp()">

    <!-- Sticky Top Header -->
    <header class="bg-indigo-950 text-white shadow-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-purpleAccent-600 p-2.5 rounded-xl text-white font-black text-xl shadow-inner">WE1</div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Working English 1 期中考全考點刷題系統
                        <span class="bg-purpleAccent-500/30 text-purple-200 border border-purple-400/40 text-[11px] px-2.5 py-0.5 rounded-full font-normal hidden sm:inline-block">100% 課本+講義完整全文無刪減</span>
                    </h1>
                    <p class="text-xs text-indigo-200">即時解析 ‧ 挖空/原文答案切換 ‧ 模擬考試</p>
                </div>
            </div>

            <!-- Mode & Status Controls -->
            <div class="flex items-center gap-2.5 flex-wrap">
                <!-- Mode Toggle -->
                <div class="bg-indigo-900/90 p-1 rounded-xl flex items-center border border-indigo-700/60 shadow-inner">
                    <button @click="setMode('practice')" 
                            :class="mode === 'practice' ? 'bg-indigo-600 text-white shadow-md font-bold' : 'text-indigo-200 hover:text-white'"
                            class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        刷題即時解析模式
                    </button>
                    <button @click="setMode('exam')" 
                            :class="mode === 'exam' ? 'bg-amber-600 text-white shadow-md font-bold' : 'text-indigo-200 hover:text-white'"
                            class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        模擬考模式
                    </button>
                </div>

                <!-- Answer Progress -->
                <div class="bg-indigo-900/80 px-3 py-1.5 rounded-xl border border-indigo-700/60 text-xs flex items-center gap-1.5">
                    <span class="text-indigo-200">完成:</span>
                    <span class="font-bold text-amber-300" x-text="`${answeredCount}/${currentQuestions.length}`"></span>
                </div>

                <!-- Nav Modal Trigger -->
                <button @click="showNavModal = true" class="bg-purpleAccent-700 hover:bg-purpleAccent-600 px-3 py-1.5 rounded-xl text-xs font-semibold text-white transition flex items-center gap-1 shadow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    考點地圖
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- Navigation Tabs & Global Text Display Mode Toggle -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between">
            <!-- Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 lg:pb-0 scrollbar-none">
                <button @click="selectedTab = 'unit1'" 
                        :class="selectedTab === 'unit1' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Unit 1 克漏字 (全部文章)</span>
                </button>
                <button @click="selectedTab = 'unit1-gram'" 
                        :class="selectedTab === 'unit1-gram' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Unit 1 文法 (Present Simple)</span>
                </button>
                <button @click="selectedTab = 'unit2'" 
                        :class="selectedTab === 'unit2' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Unit 2 克漏字 (全部文章)</span>
                </button>
                <button @click="selectedTab = 'unit2-gram'" 
                        :class="selectedTab === 'unit2-gram' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Unit 2 文法 (Future Forms)</span>
                </button>
                <button @click="selectedTab = 'unit3'" 
                        :class="selectedTab === 'unit3' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Unit 3 克漏字 (全部文章)</span>
                </button>
                <button @click="selectedTab = 'exam'" 
                        :class="selectedTab === 'exam' ? 'bg-amber-600 text-white font-bold shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-1.5">
                    <span>🏆 期中全真模擬考</span>
                </button>
            </div>

            <!-- Global Passage View Mode Toggle -->
            <button @click="showPassageAnswers = !showPassageAnswers" 
                    class="px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 border shadow-sm shrink-0"
                    :class="showPassageAnswers ? 'bg-purpleAccent-700 text-white border-purpleAccent-800' : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200'">
                <span x-text="showPassageAnswers ? '👁️ 正在顯示完整原文與答案模式 (點擊切換為測驗挖空)' : '📝 正在測驗挖空模式 (點擊切換顯示原文與紫字答案)'"></span>
            </button>
        </div>

        <!-- Exam Score Summary Banner -->
        <div x-show="mode === 'exam' && examSubmitted" x-cloak class="bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900 text-white rounded-2xl p-6 shadow-xl border border-indigo-500/30">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                    <span class="bg-amber-400 text-slate-950 font-extrabold px-3 py-1 rounded-full text-xs uppercase tracking-wider">期中測驗成績結算</span>
                    <h2 class="text-3xl font-black mt-2" x-text="`得分：${examScore} / 100 分`"></h2>
                    <p class="text-slate-300 text-xs sm:text-sm mt-1" x-text="`答對 ${correctCount} 題，答錯 ${incorrectCount} 題 (當前單元共 ${currentQuestions.length} 題)`"></p>
                </div>
                <div class="flex gap-3">
                    <button @click="onlyIncorrect = !onlyIncorrect" 
                            class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition shadow-md flex items-center gap-2"
                            :class="onlyIncorrect ? 'bg-amber-500 text-slate-950' : 'bg-rose-600 hover:bg-rose-500 text-white'">
                        <span x-text="onlyIncorrect ? '顯示全部題目' : `僅檢討錯題 (${incorrectCount})`"></span>
                    </button>
                    <button @click="resetExam()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition shadow-md">
                        重新測驗
                    </button>
                </div>
            </div>
        </div>

        <!-- Passages & Questions Container -->
        <div class="flex flex-col gap-8">
            <template x-for="passage in filteredPassages" :key="passage.id">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    
                    <!-- Section Header -->
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-100 text-indigo-800" x-text="passage.unit"></span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-200 text-slate-700" x-text="passage.section"></span>
                            <h3 class="font-bold text-slate-900 text-sm sm:text-base" x-text="passage.title"></h3>
                        </div>
                        <span class="text-xs text-slate-500 font-medium" x-text="`${passage.questions.length} 道考點`"></span>
                    </div>

                    <!-- Cloze Passage Context (Only for cloze type) -->
                    <template x-if="passage.type === 'cloze'">
                        <div class="p-6 bg-indigo-50/20 border-b border-slate-200 leading-relaxed font-sans text-sm sm:text-base">
                            <div class="flex items-center justify-between mb-3">
                                <span class="italic text-slate-500 text-xs font-bold">【課文閱讀全文對照區 / Full Passage Context】</span>
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full" 
                                      :class="showPassageAnswers ? 'bg-purpleAccent-100 text-purpleAccent-800' : 'bg-slate-200 text-slate-700'"
                                      x-text="showPassageAnswers ? '顯示完整原文與答案模式 (紫字高亮已填入)' : '測驗挖空模式 (答案隱藏中)'"></span>
                            </div>
                            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm whitespace-pre-line text-slate-800 leading-loose text-sm sm:text-base" 
                                 x-html="showPassageAnswers ? passage.fullHtml : passage.blankHtml"></div>
                        </div>
                    </template>

                    <!-- Questions Grid -->
                    <div class="p-6 grid grid-cols-1 gap-6">
                        <template x-for="q in passage.questions" :key="q.id">
                            <div :id="`q-card-${q.id}`" 
                                 class="p-5 rounded-2xl border transition-all duration-200"
                                 :class="getCardClass(q)">
                                
                                <div class="flex items-start justify-between gap-3 mb-3">
                                    <div class="flex items-start gap-2.5">
                                        <span class="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shrink-0 mt-0.5" x-text="q.number"></span>
                                        <div>
                                            <span class="font-bold text-slate-900 text-base sm:text-lg leading-snug" x-html="q.prompt"></span>
                                        </div>
                                    </div>
                                    <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-purpleAccent-100 text-purpleAccent-700 shrink-0 border border-purpleAccent-200" x-text="q.grammarTag"></span>
                                </div>

                                <!-- Options Buttons -->
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 my-3">
                                    <template x-for="opt in q.options" :key="opt.key">
                                        <button @click="selectAnswer(q.id, opt.key)"
                                                :disabled="mode === 'practice' && Boolean(userAnswers[q.id])"
                                                class="px-4 py-3 rounded-xl border text-left text-sm font-semibold transition flex items-center justify-between cursor-pointer"
                                                :class="getOptionClass(q, opt.key)">
                                            <span x-text="`${opt.key}. ${opt.text}`"></span>
                                            
                                            <!-- Option Status Indicators -->
                                            <template x-if="(mode === 'practice' && Boolean(userAnswers[q.id])) || examSubmitted">
                                                <span>
                                                    <svg x-show="opt.key === q.answer" class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                                    <svg x-show="userAnswers[q.id] === opt.key && opt.key !== q.answer" class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                </span>
                                            </template>
                                        </button>
                                    </template>
                                </div>

                                <!-- Instant Explanation Box -->
                                <div x-show="(mode === 'practice' && Boolean(userAnswers[q.id])) || examSubmitted" 
                                     x-transition:enter="transition ease-out duration-200"
                                     x-transition:enter-start="opacity-0 transform -translate-y-2"
                                     x-transition:enter-end="opacity-100 transform translate-y-0"
                                     class="mt-4 pt-4 border-t border-slate-200 text-xs leading-relaxed space-y-2.5">
                                    
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="font-bold px-2.5 py-1 rounded-md text-white text-[11px] uppercase"
                                              :class="userAnswers[q.id] === q.answer ? 'bg-emerald-600' : 'bg-rose-600'"
                                              x-text="userAnswers[q.id] === q.answer ? '✓ 答對 Correct' : '✗ 答錯 Incorrect'"></span>
                                        <span class="font-extrabold text-slate-900 text-sm" x-text="`正確答案：(${q.answer}) ${getOptionText(q, q.answer)}`"></span>
                                        <span class="text-slate-500 font-bold" x-text="`【考點聚焦：${q.focus}】`"></span>
                                    </div>

                                    <!-- Detail Grammar & Vocabulary Explanation -->
                                    <div class="bg-purpleAccent-50 p-3.5 rounded-xl border border-purpleAccent-200 text-slate-800">
                                        <div class="font-bold text-purpleAccent-800 mb-1 flex items-center gap-1 text-xs sm:text-sm">
                                            <svg class="w-4 h-4 text-purpleAccent-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            紫字考點 / 文法解析 (Grammar & Focus Rule)
                                        </div>
                                        <div class="text-slate-700 text-xs sm:text-sm font-medium" x-html="q.explanation"></div>
                                    </div>

                                    <!-- Translation -->
                                    <div class="text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-200 font-sans italic" x-text="`中文翻譯：${q.translation}`"></div>
                                </div>

                            </div>
                        </template>
                    </div>

                </div>
            </template>
        </div>

        <!-- Floating Submit Bar (Exam Mode) -->
        <div x-show="mode === 'exam' && !examSubmitted" class="fixed bottom-6 right-6 z-30">
            <button @click="submitExam()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3.5 rounded-2xl shadow-2xl transition border-2 border-amber-300 flex items-center gap-2 text-base">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                交卷計算成績 (<span x-text="`${answeredCount}/${currentQuestions.length}`"></span>)
            </button>
        </div>

    </div>

    <!-- Question Navigation Map Modal -->
    <div x-show="showNavModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div @click.away="showNavModal = false" class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
                <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                    考點快速導航地圖
                    <span class="text-xs font-normal text-slate-500" x-text="`當前共 ${currentQuestions.length} 題`"></span>
                </h3>
                <button @click="showNavModal = false" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="py-6 grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 gap-2 max-h-96 overflow-y-auto">
                <template x-for="q in currentQuestions" :key="q.id">
                    <button @click="scrollToQuestion(q.id)" 
                            class="h-10 rounded-xl font-bold text-xs flex items-center justify-center border transition"
                            :class="getNavButtonClass(q.id)">
                        <span x-text="q.number"></span>
                    </button>
                </template>
            </div>

            <div class="pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> 答對</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500"></span> 答錯</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-indigo-600"></span> 已答</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-200"></span> 未答</span>
                </div>
                <button @click="showNavModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-semibold text-slate-700">關閉</button>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        function quizApp() {
            return {
                mode: 'practice',
                selectedTab: 'unit1',
                showPassageAnswers: false, // Default: FALSE (Blank mode)
                userAnswers: {},
                examSubmitted: false,
                examScore: 0,
                correctCount: 0,
                incorrectCount: 0,
                showNavModal: false,
                onlyIncorrect: false,

                // Comprehensive 100% Full Passage & Question Data
                passagesData: [
                    // =========================================================================
                    // UNIT 1: ONLINE JOB SEARCH
                    // =========================================================================
                    {
                        id: 'u1-listening-finding-job',
                        unit: 'Unit 1',
                        unitKey: 'unit1',
                        section: 'Listening (p.10, 11)',
                        type: 'cloze',
                        title: 'Finding a Job (Peter & Shirley Dialogue)',
                        blankHtml: `Peter: I'm having trouble <span class="blank-underline">(1) _________</span> a summer job.
Shirley: What have you been doing so far?
Peter: I've been going <span class="blank-underline">(2) _________</span> the "Help Wanted" section of the newspaper every morning.
Shirley: That method is a little <span class="blank-underline">(3) _________</span>. You should try an online job search. First, you need to update your CV. Then, you can check <span class="blank-underline">(4) _________</span> some of the popular online job sites. I'll send you some websites and job boards you can check out later.
Peter: Thanks. That would be wonderful.
Shirley: You can also keep an eye <span class="blank-underline">(5) _________</span> when you're walking <span class="blank-underline">(6) _________</span> town. Some businesses will put a sign <span class="blank-underline">(7) _________</span> the window if they are looking <span class="blank-underline">(8) _________</span> new employees.
Peter: <span class="blank-underline">(9) _________</span> you mention it, I think the bakery downtown might be looking to replace their old cashier who recently <span class="blank-underline">(10) _________</span>.
Shirley: If you're interested <span class="blank-underline">(11) _________</span> bread and desserts and you can accept the hours, it might be a good fit <span class="blank-underline">(12) _________</span> you.`,

                        fullHtml: `Peter: I'm having trouble <span class="purple-text-highlight">(1) finding</span> a summer job.
Shirley: What have you been doing so far?
Peter: I've been going <span class="purple-text-highlight">(2) through</span> the "Help Wanted" section of the newspaper every morning.
Shirley: That method is a little <span class="purple-text-highlight">(3) outdated</span>. You should try an online job search. First, you need to update your CV. Then, you can check <span class="purple-text-highlight">(4) out</span> some of the popular online job sites. I'll send you some websites and job boards you can check out later.
Peter: Thanks. That would be wonderful.

                        title: 'HR Director Speech (Company Culture & Rules)',
                        blankHtml: `Hi, Peter. I'm the human resources director <span class="blank-underline">(29) _________</span> this company. Thanks for coming to my office today. Before we begin this job interview, I wanted to tell you a little more about our <span class="blank-underline">(30) _________</span>. We take pride <span class="blank-underline">(31) _________</span> providing a diverse and <span class="blank-underline">(32) _________</span> environment for our employees. We will not tolerate any bullying or <span class="blank-underline">(33) _________</span> at this company. Anyone who breaks these rules will be let go immediately. As you may have noticed, our company <span class="blank-underline">(34) _________</span> is somewhat laid-back. Employees are not required to dress formally, unless they will be participating <span class="blank-underline">(35) _________</span> a meeting with one of our <span class="blank-underline">(36) _________</span>. The boss believes that people perform their best when they feel relaxed. However, don't let <span class="blank-underline">(37) _________</span> fool you. We work extremely hard and are expected to always try our best. When necessary, employees are expected to work weekends in order to complete their projects and assignments <span class="blank-underline">(38) _________</span> time. Before I move on to the interview, do you have any questions for me?`,

                        fullHtml: `Hi, Peter. I'm the human resources director <span class="purple-text-highlight">(29) for</span> this company. Thanks for coming to my office today. Before we begin this job interview, I wanted to tell you a little more about our <span class="purple-text-highlight">(30) culture</span>. We take pride <span class="purple-text-highlight">(31) in</span> providing a diverse and <span class="purple-text-highlight">(32) inclusive</span> environment for our employees. We will not tolerate any bullying or <span class="purple-text-highlight">(33) harassment</span> at this company. Anyone who breaks these rules will be let go immediately. As you may have noticed, our company <span class="purple-text-highlight">(34) culture</span> is somewhat laid-back. Employees are not required to dress formally, unless they will be participating <span class="purple-text-highlight">(35) in</span> a meeting with one of our <span class="purple-text-highlight">(36) clients</span>. The boss believes that people perform their best when they feel relaxed. However, don't let <span class="purple-text-highlight">(37) appearances</span> fool you. We work extremely hard and are expected to always try our best. When necessary, employees are expected to work weekends in order to complete their projects and assignments <span class="purple-text-highlight">(38) on</span> time. Before I move on to the interview, do you have any questions for me?`,

                            { id: 33, number: 33, prompt: "We will not tolerate any bullying or [ (33) _________ ]...", options: [{key:'A', text:'harassment'}, {key:'B', text:'harass'}, {key:'C', text:'harassed'}], answer: 'A', focus: 'harassment 名詞', grammarTag: '單字填空', explanation: '不可數名詞表示「霸凌或騷擾 (harassment)」。', translation: '我們絕不容忍任何霸凌或騷擾。' },

                            { id: 36, number: 36, prompt: "...with one of our [ (36) _________ ].", options: [{key:'A', text:'clients'}, {key:'B', text:'client'}, {key:'C', text:'clientele'}], answer: 'A', focus: 'one of + 複數名詞', grammarTag: '單字填空', explanation: 'one of our 之後接複數名詞 <b>clients</b>（客戶）。', translation: '與我們的一位客戶碰面。' },

                        title: 'Follow-up Email (Dale Woodson to Shawna Coolridge)',
                        blankHtml: `Dear Shawna,

It was so nice to meet with you yesterday to discuss the Business Development Specialist position with Brackston Inc. I think there are some exciting things <span class="blank-underline">(52) _________</span> the horizon for the company in the upcoming years. I truly believe that with the right team it is possible to take the company <span class="blank-underline">(53) _________</span> new heights.

Sincerely,
Dale Woodson`,

                        fullHtml: `Dear Shawna,

It was so nice to meet with you yesterday to discuss the Business Development Specialist position with Brackston Inc. I think there are some exciting things <span class="purple-text-highlight">(52) on</span> the horizon for the company in the upcoming years. I truly believe that with the right team it is possible to take the company <span class="purple-text-highlight">(53) to</span> new heights.

                    {
                        id: 'u2-listening-comp-hr-advice',
                        unit: 'Unit 2',
                        unitKey: 'unit2',
                        section: 'Listening Comprehension (p.24)',
                        type: 'cloze',
                        title: 'HR Director Advice (Larry Sanchez Speech)',
                        blankHtml: `My name is Larry Sanchez. For several <span class="blank-underline">(56) _________</span>, I've helped several large corporations hire the best talent. During that time, I've met with both good and bad job <span class="blank-underline">(57) _________</span>. I'd like to take this opportunity to pass on some advice to you. For starters, it's always a good idea to do some <span class="blank-underline">(58) _________</span> on the company you want to work for before the interview. You should become <span class="blank-underline">(59) _________</span> with the products and <span class="blank-underline">(60) _________</span> the company offers. You should also study the company roadmap online if possible. It also helps to develop <span class="blank-underline">(61) _________</span> with the person who is interviewing you. Interviewers tend to favor people whom they like. Also, select the clothes you want to wear the night before your interview. This will reduce stress on the interview day, and allow you to <span class="blank-underline">(62) _________</span> your brainpower for the interview. Finally, always be punctual. Making your interviewer wait isn't professional and will hurt your chances of landing the job.`,

                        fullHtml: `My name is Larry Sanchez. For several <span class="purple-text-highlight">(56) decades</span>, I've helped several large corporations hire the best talent. During that time, I've met with both good and bad job <span class="purple-text-highlight">(57) candidates</span>. I'd like to take this opportunity to pass on some advice to you. For starters, it's always a good idea to do some <span class="purple-text-highlight">(58) homework</span> on the company you want to work for before the interview. You should become <span class="purple-text-highlight">(59) familiar</span> with the products and <span class="purple-text-highlight">(60) services</span> the company offers. You should also study the company roadmap online if possible. It also helps to develop <span class="purple-text-highlight">(61) rapport</span> with the person who is interviewing you. Interviewers tend to favor people whom they like. Also, select the clothes you want to wear the night before your interview. This will reduce stress on the interview day, and allow you to <span class="purple-text-highlight">(62) preserve</span> your brainpower for the interview. Finally, always be punctual. Making your interviewer wait isn't professional and will hurt your chances of landing the job.`,
                        questions: [

                            { id: 57, number: 57, prompt: "...met with both good and bad job [ (57) _________ ].", options: [{key:'A', text:'candidates'}, {key:'B', text:'candidate'}, {key:'C', text:'candid'}], answer: 'A', focus: 'job candidates', grammarTag: '課本填空', explanation: '複數名詞 <b>candidates</b> 表示「求職應徵者」。', translation: '遇到過好與不好的求職應徵者。' },
                            { id: 58, number: 58, prompt: "...always a good idea to do some [ (58) _________ ] on the company...", options: [{key:'A', text:'homework'}, {key:'B', text:'housework'}, {key:'C', text:'home'}], answer: 'A', focus: 'do homework on', grammarTag: '課本片語', explanation: '<b>do homework on a company</b> 表示「做功課/研究某公司」。', translation: '對面試的公司做點功課研究。' },
                            { id: 59, number: 59, prompt: "You should become [ (59) _________ ] with the products...", options: [{key:'A', text:'familiar'}, {key:'B', text:'family'}, {key:'C', text:'familiarity'}], answer: 'A', focus: 'become familiar with', grammarTag: '課本片語', explanation: '<b>become familiar with</b> 表示「熟悉...」。', translation: '你應該要熟悉公司提供的產品。' },
                            { id: 60, number: 60, prompt: "...products and [ (60) _________ ] the company offers.", options: [{key:'A', text:'services'}, {key:'B', text:'serve'}, {key:'C', text:'servant'}], answer: 'A', focus: 'services 名詞', grammarTag: '課本填空', explanation: '複數名詞 <b>services</b> 表示「服務項目」。', translation: '公司所提供的產品與服務。' },
                            { id: 61, number: 61, prompt: "...helps to develop [ (61) _________ ] with the interviewer.", options: [{key:'A', text:'rapport'}, {key:'B', text:'report'}, {key:'C', text:'repeat'}], answer: 'A', focus: 'develop rapport with', grammarTag: '課本片語', explanation: '<b>develop rapport with</b> 表示「與...建立融洽關係」。', translation: '與面試官建立融洽關係。' },
                            { id: 62, number: 62, prompt: "...allow you to [ (62) _________ ] your brainpower...", options: [{key:'A', text:'preserve'}, {key:'B', text:'reserve'}, {key:'C', text:'deserve'}], answer: 'A', focus: 'preserve brainpower', grammarTag: '課本填空', explanation: '動詞 <b>preserve</b> 表示「維護、保留（腦力）」。', translation: '讓你在面試時保留腦力與精力。' }

                    {

                        unit: 'Unit 2 文法',
                        unitKey: 'unit2-gram',
                        section: 'Grammar Practice',
                        type: 'grammar',
                        title: 'Future Forms (will vs. be going to) (對照 文法練習.pdf p.2-3 全數 21 題)',
                        blankHtml: '', fullHtml: '',
                        questions: [
                            { id: 201, number: 1, prompt: "[ Square 1 ] Mum has bought eggs, flour and fruit. She [ (201) _________ ] bake a cake.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'is baking'}], answer: 'A', focus: 'Plan: ingredients bought', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：She has already bought the ingredients.（事先已有買食材的具體計畫），使用 <b>is going to</b>。', translation: '媽媽已經買好了食材，她打算做蛋糕。' },
                            { id: 202, number: 2, prompt: "[ Square 2 ] [ (202) _________ ] Jessie be back soon? I need to talk to her.", options: [{key:'A', text:'Will'}, {key:'B', text:'Is'}, {key:'C', text:'Is going to'}], answer: 'A', focus: 'Prediction Question', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Question about a prediction -> <b>Will</b>。', translation: '潔西很快就會回來嗎？' },
                            { id: 203, number: 3, prompt: "[ Square 3 ] Next year my sister [ (203) _________ ] learn how to drive a car.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'shall'}], answer: 'A', focus: 'Future plan', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Future plan（明年的計畫打算），使用 <b>is going to</b>。', translation: '明年我姐姐打算學開車。' },
                            { id: 204, number: 4, prompt: "[ Square 4 ] I hope I [ (204) _________ ] be happy when I grow up.", options: [{key:'A', text:'will'}, {key:'B', text:'am going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'I hope -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction/hope (I hope...) -> <b>will</b>。', translation: '我希望我長大後會快樂。' },
                            { id: 206, number: 5, prompt: "[ Square 6 ] We [ (206) _________ ] meet our cousins tonight.", options: [{key:'A', text:'are going to'}, {key:'B', text:'will'}, {key:'C', text:'would'}], answer: 'A', focus: 'Already arranged plan', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Future plan (already arranged) -> <b>are going to</b>。', translation: '我們今晚打算跟表親們碰面。' },
                            { id: 207, number: 6, prompt: "[ Square 7 ] I [ (207) _________ ] eat more sweets before dinner. I promise.", options: [{key:'A', text:"won't"}, {key:'B', text:"am not going to"}, {key:'C', text:"don't"}], answer: 'A', focus: 'Promise -> won\'t', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Promise (I promise) -> <b>won\'t</b>。', translation: '我保證晚餐前不會再吃糖果。' },
                            { id: 208, number: 7, prompt: "[ Square 8 ] I [ (208) _________ ] spend the money I've been saving on a new laptop.", options: [{key:'A', text:'am going to'}, {key:'B', text:'will'}, {key:'C', text:'would'}], answer: 'A', focus: 'Intention after saving', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Intention: decided after saving for months -> <b>am going to</b>。', translation: '我打算用存下的錢買新筆電。' },
                            { id: 210, number: 8, prompt: "[ Square 10 ] I [ (210) _________ ] call Liz as soon as I'm back.", options: [{key:'A', text:'will'}, {key:'B', text:'am going to'}, {key:'C', text:'am calling'}], answer: 'A', focus: 'Promise / Immediate decision', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Promise / On-the-spot decision -> <b>will</b>。', translation: '我一回來就會打給莉茲。' },
                            { id: 211, number: 9, prompt: "[ Square 11 ] Diana [ (211) _________ ] wash her hair this afternoon.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'was going to'}], answer: 'A', focus: 'Future plan', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Future plan -> <b>is going to</b>。', translation: '戴安娜今天下午打算洗頭。' },
                            { id: 212, number: 10, prompt: "[ Square 12 ] [ (212) _________ ] you lend me a biro? I've got nothing to write with.", options: [{key:'A', text:'Will'}, {key:'B', text:'Are you going to'}, {key:'C', text:'Do'}], answer: 'A', focus: 'Request at the moment', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Request made at the moment of speaking -> <b>Will</b>。', translation: '你可以借我一支原子筆嗎？' },
                            { id: 213, number: 11, prompt: "[ Square 13 ] There are no clouds in the sky. It [ (213) _________ ] be a beautiful day.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'is'}], answer: 'A', focus: 'Present evidence (no clouds)', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction based on present evidence (no clouds) -> <b>is going to</b>。', translation: '天空萬里無雲，今天將會是美好的一天。' },
                            { id: 214, number: 12, prompt: "[ Square 14 ] I think people [ (214) _________ ] speak one language someday.", options: [{key:'A', text:'will'}, {key:'B', text:'are going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'I think -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction/opinion (I think) -> <b>will</b>。', translation: '我覺得未來人們會講同一種語言。' },
                            { id: 215, number: 13, prompt: "[ Square 15 ] Steve is tired. He [ (215) _________ ] take a short nap.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'takes'}], answer: 'A', focus: 'Evidence: he is tired', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Intention based on present evidence (he is tired) -> <b>is going to</b>。', translation: '史蒂夫累了，他打算小睡一下。' },
                            { id: 216, number: 14, prompt: "[ Square 16 ] Don't worry mum. I [ (216) _________ ] pick Tommy up from school today.", options: [{key:'A', text:'will'}, {key:'B', text:'am going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'Offer -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Offer / On-the-spot decision -> <b>will</b>。', translation: '別擔心媽媽，我今天會去接湯米。' },
                            { id: 218, number: 15, prompt: "[ Square 18 ] Look! Pam [ (218) _________ ] jump into the swimming pool.", options: [{key:'A', text:'is going to'}, {key:'B', text:'will'}, {key:'C', text:'jumps'}], answer: 'A', focus: 'Evidence: Look!', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction based on present evidence (Look!) -> <b>is going to</b>。', translation: '看！潘就要跳進游泳池裡了。' },
                            { id: 219, number: 16, prompt: "[ Square 19 ] We [ (219) _________ ] probably go mountaineering next summer.", options: [{key:'A', text:'will'}, {key:'B', text:'are going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'probably -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction with \'probably\' -> <b>will</b>。', translation: '我們明年夏天很可能會去登山。' },
                            { id: 220, number: 17, prompt: "[ Square 20 ] Your T-shirt has a stain. [ (220) _________ ] wash it?", options: [{key:'A', text:'Are you going to'}, {key:'B', text:'Will you'}, {key:'C', text:'Do you'}], answer: 'A', focus: 'Asking about intention', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Asking about a plan/intention -> <b>Are you going to</b>。', translation: '你的 T 恤有污漬，你打算洗它嗎？' },
                            { id: 222, number: 18, prompt: "[ Square 22 ] I [ (222) _________ ] help you with your IT project.", options: [{key:'A', text:'will'}, {key:'B', text:'am going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'Offer -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Offer -> <b>will</b>。', translation: '我會協助你完成你的 IT 專案。' },
                            { id: 223, number: 19, prompt: "[ Square 23 ] I'm afraid Helen [ (223) _________ ] pass her final exam...", options: [{key:'A', text:"won't"}, {key:'B', text:"isn't going to"}, {key:'C', text:"doesn't"}], answer: 'A', focus: 'I\'m afraid -> won\'t', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction (I\'m afraid...) -> <b>won\'t</b>。', translation: '我恐怕海倫期末考不會過。' },
                            { id: 224, number: 20, prompt: "[ Square 24 ] George [ (224) _________ ] probably go to the concert.", options: [{key:'A', text:'will'}, {key:'B', text:'is going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'probably -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction with \'probably\' -> <b>will</b>。', translation: '喬治很可能會去演唱會。' },
                            { id: 225, number: 21, prompt: "[ Square 25 ] Perhaps your sister [ (225) _________ ] accompany you to the doctor?", options: [{key:'A', text:'will'}, {key:'B', text:'is going to'}, {key:'C', text:'would'}], answer: 'A', focus: 'perhaps -> will', grammarTag: '文法練習.pdf p.2-3', explanation: '<b>判斷規則</b>：Prediction with \'perhaps\' -> <b>will</b>。', translation: '也許你姐姐會陪你看醫生？' }
                        ]

                    {

                        title: 'Creative Writing & Movie Idea (Geoff & Candy Dialogue)',
                        blankHtml: `Geoff: Hi Candy. Long time no see. How's everything been lately?
Candy: I've been pretty busy. I just had a long conversation with the boss.

                get currentQuestions() {
                    let questions = [];
                    this.filteredPassages.forEach(p => {
                        questions.push(...p.questions);
                    });
                    return questions;
                },

                get filteredPassages() {
                    return this.passagesData.filter(p => {
                        if (this.selectedTab === 'exam') return true;
                        return p.unitKey === this.selectedTab;
                    }).map(p => {
                        if (this.onlyIncorrect && (this.mode === 'exam' && this.examSubmitted)) {
                            return {
                                ...p,
                                questions: p.questions.filter(q => this.userAnswers[q.id] && this.userAnswers[q.id] !== q.answer)
                            };
                        }
                        return p;
                    }).filter(p => p.questions.length > 0);
                },

                get answeredCount() {
                    const currentQIds = this.currentQuestions.map(q => q.id);
                    return Object.keys(this.userAnswers).filter(id => currentQIds.includes(Number(id))).length;
                },

                initApp() {
                    // Application Initialization
                },

                setMode(newMode) {
                    this.mode = newMode;
                    if (newMode === 'exam') {
                        this.examSubmitted = false;
                        this.onlyIncorrect = false;
                    }
                },

                selectAnswer(questionId, optionKey) {
                    this.userAnswers = { ...this.userAnswers, [questionId]: optionKey };
                },

                getOptionText(q, key) {
                    const opt = q.options.find(o => o.key === key);
                    return opt ? opt.text : '';
                },

                getCardClass(q) {
                    const ans = this.userAnswers[q.id];
                    if (!ans) return 'border-slate-200 bg-white hover:border-indigo-300';
                    
                    if (this.mode === 'practice' || this.examSubmitted) {
                        return ans === q.answer ? 'border-emerald-300 bg-emerald-50/20' : 'border-rose-300 bg-rose-50/20';
                    }
                    return 'border-indigo-400 bg-indigo-50/20';
                },

                getOptionClass(q, optKey) {
                    const userAns = this.userAnswers[q.id];
                    const isSelected = userAns === optKey;
                    
                    if (this.mode === 'practice' || this.examSubmitted) {
                        if (!userAns) {
                            return 'border-slate-200 bg-white text-slate-700 hover:border-indigo-400 hover:bg-indigo-50/30';
                        }
                        if (optKey === q.answer) {
                            return 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-500/40 shadow-sm';
                        }
                        if (isSelected && optKey !== q.answer) {
                            return 'border-rose-500 bg-rose-50 text-rose-900 font-bold ring-2 ring-rose-500/40 shadow-sm';
                        }
                        return 'border-slate-200 bg-slate-50 text-slate-400 opacity-60';
                    } else {
                        if (isSelected) {
                            return 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold ring-2 ring-indigo-500/40 shadow-sm';
                        }
                        return 'border-slate-200 bg-white text-slate-700 hover:border-indigo-300';
                    }
                },

                submitExam() {
                    const total = this.currentQuestions.length;
                    if (total === 0) return;

                    let correct = 0;
                    this.currentQuestions.forEach(q => {
                        if (this.userAnswers[q.id] === q.answer) {
                            correct++;
                        }
                    });

                    this.correctCount = correct;
                    this.incorrectCount = total - correct;
                    this.examScore = Math.round((correct / total) * 100);
                    this.examSubmitted = true;

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                resetExam() {
                    this.userAnswers = {};
                    this.examSubmitted = false;
                    this.onlyIncorrect = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                scrollToQuestion(id) {
                    this.showNavModal = false;
                    const el = document.getElementById(`q-card-${id}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                },

                getNavButtonClass(id) {
                    const ans = this.userAnswers[id];
                    const q = this.currentQuestions.find(item => item.id === id);

                    if ((this.mode === 'practice' || this.examSubmitted) && ans) {
                        if (q && ans === q.answer) {
                            return 'bg-emerald-500 text-white border-emerald-600 font-bold';
                        }
                        return 'bg-rose-500 text-white border-rose-600 font-bold';
                    }

                    if (ans) {
                        return 'bg-indigo-600 text-white border-indigo-700 font-bold';
                    }
                    return 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';
                }
            }
        }
    </script>
